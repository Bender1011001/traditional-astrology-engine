services:
  - type: web
    name: astrology-engine
    env: docker
    plan: free
    repo: https://github.com/Bender1011001/astrology # Updated to reflect user's likely repo structure if known, or generic. Actually best to omitting 'repo' defaults to current linked.
    envVars:
      - key: PORT
        value: 10000
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDER_EMAIL
        value: noreply@traditional-astrology.com
      - key: SITE_BASE_URL
        value: https://traditional-astrology.com
