<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Codex Caelestis</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#f4efe6">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Sora:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260129polish">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 4rem auto;
            padding: 2rem;
            background: var(--surface);
            border: 1px solid var(--border-color);
            position: relative;
        }

        .auth-container::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            border: 1px solid var(--border-color);
            pointer-events: none;
            opacity: 0.5;
        }

        .auth-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            text-align: center;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
        }
        
        .auth-subtitle {
            font-family: 'Sora', sans-serif;
            font-size: 0.9rem;
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .input-group input {
            width: 100%;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid var(--border-color);
            font-family: 'Sora', sans-serif;
            color: var(--text);
            transition: all 0.2s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--gold);
            background: var(--surface);
            box-shadow: 0 0 0 1px var(--gold);
        }

        button[type="submit"] {
            width: 100%;
            background: var(--primary);
            color: var(--surface);
            border: 1px solid var(--primary);
            padding: 1rem;
            font-family: 'Space Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-top: 1rem;
        }

        button[type="submit"]:hover {
            background: var(--gold);
            border-color: var(--gold);
            color: var(--primary);
        }

        .auth-links {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .auth-links a {
            color: var(--gold);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .auth-links a:hover {
            border-bottom-color: var(--gold);
        }
    </style>
</head>

<body>
    <div class="background-globes">
        <div class="globe globe-1"></div>
        <div class="globe globe-2"></div>
        <div class="stars-overlay"></div>
    </div>

    <main class="container">
        <header>
            <div class="header-content">
                <nav class="header-actions" aria-label="Primary" style="justify-content: center;">
                    <a class="help-btn" href="index.html">Home</a>
                </nav>
            </div>
        </header>

        <div class="auth-container">
            <h1 class="auth-title">Reset Password</h1>
            <p class="auth-subtitle">Enter your email address and we will send you a link to reset your password.</p>
            
            <form id="forgotForm">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="user@example.com">
                </div>
                
                <button type="submit" id="submitBtn">Send Reset Link</button>
            </form>
            
            <div class="auth-links">
                <p>Remember your password? <a href="login.html">Login</a></p>
            </div>
            
            <div id="statusMessage"
                style="text-align: center; margin-top: 1rem; color: var(--text-main); min-height: 1.5em; font-size: 0.9rem;"></div>
        </div>
    </main>

    <script src="config.js"></script>
    <script>
        const API_BASE = window.CAEL_API_BASE || "";
        function apiUrl(path) { return `${API_BASE}${path}`; }

        const form = document.getElementById('forgotForm');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const status = document.getElementById('statusMessage');
            const btn = document.getElementById('submitBtn');

            btn.disabled = true;
            btn.textContent = "Sending...";
            status.textContent = "";

            try {
                const resp = await fetch(apiUrl('/api/v1/auth/forgot-password'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await resp.json();
                
                // Always show success message for security/usability
                status.textContent = data.message || "If an account exists, instructions have been sent.";
                status.style.color = "var(--success)";
                form.reset();
                
            } catch (err) {
                status.textContent = "An error occurred. Please try again.";
                status.style.color = "var(--danger)";
            } finally {
                btn.disabled = false;
                btn.textContent = "Send Reset Link";
            }
        });
        
        // Dark mode init
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (prefersDark || localStorage.getItem("cael_theme") === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
        }
    </script>
</body>
</html>
