    <style>
        .auth-container {
            max-width: 400px;
            margin: 4rem auto;
            padding: 2rem;
            background: var(--surface);
            border: 1px solid var(--border-color);
            position: relative;
        }

        .auth-container::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            border: 1px solid var(--border-color);
            pointer-events: none;
            opacity: 0.5;
        }

        .auth-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            text-align: center;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .input-group input {
            width: 100%;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid var(--border-color);
            font-family: 'Sora', sans-serif;
            color: var(--text);
            transition: all 0.2s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--gold);
            background: var(--surface);
            box-shadow: 0 0 0 1px var(--gold);
        }

        button[type="submit"] {
            width: 100%;
            background: var(--primary);
            color: var(--surface);
            border: 1px solid var(--primary);
            padding: 1rem;
            font-family: 'Space Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-top: 1rem;
        }

        button[type="submit"]:hover {
            background: var(--gold);
            border-color: var(--gold);
            color: var(--primary);
        }

        .auth-links {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .auth-links a {
            color: var(--gold);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .auth-links a:hover {
            border-bottom-color: var(--gold);
        }
    </style>

        <div class="auth-container">
            <h1 class="auth-title">Register</h1>
            <form id="registerForm">
                <div class="input-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" required placeholder="John Dee">
                </div>
                <div class="input-group">
                    <label for="username">Email</label>
                    <input type="email" id="username" required placeholder="user@example.com">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" required>
                </div>

                <div
                    style="margin-bottom: 1.5rem; display: flex; align-items: flex-start; gap: 0.5rem; font-size: 0.8rem; color: var(--text-muted);">
                    <input type="checkbox" id="termsConsent" required style="margin-top: 0.2rem;">
                    <label for="termsConsent" style="cursor: pointer; line-height: 1.4;">
                        I agree to the <a href="terms.html" target="_blank" style="color: var(--gold);">Terms of
                            Service</a> and <a href="privacy.html" target="_blank" style="color: var(--gold);">Privacy
                            Policy</a>.
                    </label>
                </div>

                <button type="submit">Create Account</button>
            </form>
            <div class="auth-links">
                <p>Already have an account? <a href="login.html">Log in</a></p>
            </div>
            <div id="authMessage"
                style="text-align: center; margin-top: 1rem; color: var(--danger); min-height: 1.5em;"></div>
        </div>
    </main>

    <script src="config.js?v=20260212azure2"></script>
    <script>
        const API_BASE = window.CAEL_API_BASE || "";
        function apiUrl(path) { return `${API_BASE}${path}`; }
        const apiFetch = window.caelFetchWithFallback || ((path, init) => fetch(apiUrl(path), init));

        function getSelectedPlanTier() {
            try {
                const params = new URLSearchParams(window.location.search);
                const qp = params.get("plan") || params.get("tier");
                const ls = localStorage.getItem("cael_selected_plan");
                const raw = (qp || ls || "").toLowerCase().trim();
                if (raw === "practitioner" || raw === "studio") return raw;
            } catch (e) { }
            return null;
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('authMessage');
            const submitBtn = e.target.querySelector('button[type="submit"]');

            const name = document.getElementById('fullname').value;
            const email = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validate passwords match
            if (password !== confirmPassword) {
                msg.textContent = "Passwords do not match.";
                msg.style.color = "var(--danger)";
                return;
            }

            // Validate password strength
            if (password.length < 8) {
                msg.textContent = "Password must be at least 8 characters.";
                msg.style.color = "var(--danger)";
                return;
            }

            msg.textContent = "Creating your account...";
            msg.style.color = "var(--text-muted)";
            submitBtn.disabled = true;

            try {
                const plan_tier = getSelectedPlanTier();
                const resp = await apiFetch('/api/v1/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, name, plan_tier })
                });

                const contentType = resp.headers.get("content-type");
                if (contentType && contentType.indexOf("application/json") !== -1) {
                    const data = await resp.json();
                    if (!resp.ok) {
                        throw new Error(data.detail || 'Registration failed.');
                    }

                    // Store auth token and user data (user is logged in after registration)
                    localStorage.setItem('cael_auth_token', data.token);
                    localStorage.setItem('cael_user', JSON.stringify(data.user));

                    msg.textContent = "Account created! Redirecting...";
                    msg.style.color = "var(--success)";

                    setTimeout(() => {
                        // If user was forced to register to generate a reading, return them there.
                        try {
                            const next = localStorage.getItem("cael_post_auth_redirect") || "";
                            if (next) {
                                localStorage.removeItem("cael_post_auth_redirect");
                                const isRelative = next.startsWith("/") || /^[A-Za-z0-9_.\\-]+\\.html(\\?.*)?$/.test(next);
                                const isSameOrigin = next.startsWith(window.location.origin);
                                if (isRelative || isSameOrigin) {
                                    window.location.href = next;
                                    return;
                                }
                            }
                        } catch (e) { }
                        // Default: go to dashboard so the user can start trial/checkout immediately.
                        window.location.href = "profile.html";
                    }, 1000);
                } else {
                    const text = await resp.text();
                    console.error("Server returned non-JSON response:", text);
                    throw new Error(`Server Error (Status ${resp.status}). Please try again later.`);
                }

            } catch (err) {
                msg.textContent = err.message || "Connection error.";
                msg.style.color = "var(--danger)";
                submitBtn.disabled = false;
            }
        });

        // Check if already logged in
        const existingToken = localStorage.getItem('cael_auth_token');
        if (existingToken) {
            document.getElementById('authMessage').textContent = "You are already logged in.";
            document.getElementById('authMessage').style.color = "var(--gold)";
        }

        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (prefersDark || localStorage.getItem("cael_theme") === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
        }
    </script>
