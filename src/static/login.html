<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Codex Caelestis</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#f4efe6">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Sora:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260129polish">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 4rem auto;
            padding: 2rem;
            background: var(--surface);
            border: 1px solid var(--border-color);
            position: relative;
        }

        .auth-container::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            border: 1px solid var(--border-color);
            pointer-events: none;
            opacity: 0.5;
        }

        .auth-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            text-align: center;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .input-group input {
            width: 100%;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid var(--border-color);
            font-family: 'Sora', sans-serif;
            color: var(--text);
            transition: all 0.2s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--gold);
            background: var(--surface);
            box-shadow: 0 0 0 1px var(--gold);
        }

        button[type="submit"] {
            width: 100%;
            background: var(--primary);
            color: var(--surface);
            border: 1px solid var(--primary);
            padding: 1rem;
            font-family: 'Space Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-top: 1rem;
        }

        button[type="submit"]:hover {
            background: var(--gold);
            border-color: var(--gold);
            color: var(--primary);
        }

        .auth-links {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .auth-links a {
            color: var(--gold);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .auth-links a:hover {
            border-bottom-color: var(--gold);
        }
    </style>
</head>

<body>
    <div class="background-globes">
        <div class="globe globe-1"></div>
        <div class="globe globe-2"></div>
        <div class="stars-overlay"></div>
    </div>

    <main class="container">
        <header>
            <div class="header-content">
                <nav class="header-actions" aria-label="Primary" style="justify-content: center;">
                    <a class="help-btn" href="index.html">HOME</a>
                    <a class="help-btn" href="about.html">ABOUT</a>
                    <a class="help-btn" href="methodology.html">METHODOLOGY</a>
                    <a class="help-btn" href="sample-reading.html">SAMPLE</a>
                    <a class="help-btn" href="resources.html">RESOURCES</a>
                    <a class="help-btn" href="faq.html">FAQ</a>
                </nav>
            </div>
        </header>

        <div class="auth-container">
            <h1 class="auth-title">Practitioner Login</h1>
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Email</label>
                    <input type="email" id="username" required placeholder="user@example.com">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <!-- Hidden input until persistent sessions are implemented -->
                <!-- <div class="checkbox-row" style="margin-bottom: 1rem;">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe" style="display:inline; margin-left: 0.5rem;">Remember me</label>
                </div> -->
                <button type="submit">Access System</button>
            </form>
            <div class="auth-links">
                <p>Don't have an account? <a href="register.html">Register</a></p>
                <p><a href="#">Forgot password?</a></p>
            </div>
            <div id="authMessage"
                style="text-align: center; margin-top: 1rem; color: var(--danger); min-height: 1.5em;"></div>
        </div>
    </main>

    <script>
        const API_BASE = window.CAEL_API_BASE || "";
        function apiUrl(path) { return `${API_BASE}${path}`; }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('authMessage');
            const submitBtn = e.target.querySelector('button[type="submit"]');

            msg.textContent = "Authenticating...";
            msg.style.color = "var(--text-muted)";
            submitBtn.disabled = true;

            try {
                const resp = await fetch(apiUrl('/api/auth/login'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await resp.json();

                if (!resp.ok) {
                    throw new Error(data.detail || 'Login failed.');
                }

                // Store auth token and user data
                localStorage.setItem('cael_auth_token', data.token);
                localStorage.setItem('cael_user', JSON.stringify(data.user));

                msg.textContent = "Login successful! Redirecting...";
                msg.style.color = "var(--success)";

                setTimeout(() => {
                location.href = "index.html";
                }, 1000);

            } catch (err) {
                msg.textContent = err.message || "Connection error.";
                msg.style.color = "var(--danger)";
                submitBtn.disabled = false;
            }
        });

        // Check if already logged in
        const existingToken = localStorage.getItem('cael_auth_token');
        if (existingToken) {
            document.getElementById('authMessage').textContent = "You are already logged in.";
            document.getElementById('authMessage').style.color = "var(--gold)";
        }

        // Dark mode init
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (prefersDark || localStorage.getItem("cael_theme") === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
        }
    </script>
</body>

</html>
