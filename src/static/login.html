        .auth-container {
            max-width: 400px;
            margin: 4rem auto;
            padding: 2rem;
            background: var(--surface);
            border: 1px solid var(--border-color);
            position: relative;
        }

        .auth-container::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            border: 1px solid var(--border-color);
            pointer-events: none;
            opacity: 0.5;
        }

        .auth-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            text-align: center;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .input-group input {
            width: 100%;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid var(--border-color);
            font-family: 'Sora', sans-serif;
            color: var(--text);
            transition: all 0.2s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--gold);
            background: var(--surface);
            box-shadow: 0 0 0 1px var(--gold);
        }

        button[type="submit"] {
            width: 100%;
            background: var(--primary);
            color: var(--surface);
            border: 1px solid var(--primary);
            padding: 1rem;
            font-family: 'Space Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-top: 1rem;
        }

        button[type="submit"]:hover {
            background: var(--gold);
            border-color: var(--gold);
            color: var(--primary);
        }

        .auth-links {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .auth-links a {
            color: var(--gold);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .auth-links a:hover {
            border-bottom-color: var(--gold);
        }

            <h1 class="auth-title">Practitioner Login</h1>
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Email</label>
                    <input type="email" id="username" required placeholder="user@example.com">
                </div>
                <div class="input-group">

                <!-- Hidden input until persistent sessions are implemented -->

                style="text-align: center; margin-top: 1rem; color: var(--danger); min-height: 1.5em;"></div>
        </div>

    <script>
        const API_BASE = window.CAEL_API_BASE || "";
        function apiUrl(path) { return `${API_BASE}${path}`; }
        const apiFetch = window.caelFetchWithFallback || ((path, init) => fetch(apiUrl(path), init));

        const loginForm = document.getElementById('loginForm');
        if (loginForm) {
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const status = document.getElementById('authMessage');

                status.textContent = "Authenticating...";
                status.style.color = "var(--text-muted)"; // Changed from var(--text-main) to match existing style

                try {
                    const resp = await apiFetch('/api/v1/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });

                    const contentType = resp.headers.get("content-type");
                    if (contentType && contentType.indexOf("application/json") !== -1) {
                        const data = await resp.json();
                        if (!resp.ok) {
                            throw new Error(data.detail || 'Login failed');
                        }

                        // Success
                        localStorage.setItem('cael_auth_token', data.token);
                        localStorage.setItem('cael_user', JSON.stringify(data.user));

                        status.textContent = "Success! Redirecting...";
                        status.style.color = "var(--success)";

                        setTimeout(() => {
                            // If user was forced to log in to generate a reading, return them there.
                            try {
                                const next = localStorage.getItem("cael_post_auth_redirect") || "";
                                if (next) {
                                    localStorage.removeItem("cael_post_auth_redirect");
                                    const isRelative = next.startsWith("/") || /^[A-Za-z0-9_.\\-]+\\.html(\\?.*)?$/.test(next);
                                    const isSameOrigin = next.startsWith(window.location.origin);
                                    if (isRelative || isSameOrigin) {
                                        window.location.href = next;
                                        return;
                                    }
                                }
                            } catch (e) { }
                            window.location.href = "index.html";
                        }, 1000);
                    } else {
                        // Not JSON - likely a 404 or 500 HTML page
                        const text = await resp.text();
                        console.error("Server returned non-JSON response:", text);
                        throw new Error(`Server Error (Status ${resp.status}). Please try again later.`);
                    }
                } catch (err) {
                    status.textContent = err.message;
                    status.style.color = "var(--danger)";
                }
            });
        }

        function checkExistingToken() {
            const token = localStorage.getItem('cael_auth_token');
            if (token) {
                let email = 'User';
                try {
                    const userJson = localStorage.getItem('cael_user');
                    if (userJson) {
                        const user = JSON.parse(userJson);
                        email = user.email || 'User';
                    }
                } catch (e) { }

                const title = document.querySelector('.auth-title');
                if (title) title.textContent = "WELCOME BACK";

                const form = document.getElementById('loginForm');
                if (form) {
                    form.innerHTML = `
                        <p style="text-align:center; margin-bottom: 2rem;">You are currently logged in as <strong>${email}</strong>.</p>
                        <div style="display: flex; flex-direction: column; gap: 1rem;">
                            <a href="index.html" class="btn-primary" style="text-decoration: none; text-align:center; padding: 1rem; background: var(--primary); color: var(--surface); display:block; font-family: 'Space Mono', monospace; text-transform:uppercase;">Go to Home</a>
                            <button onclick="localStorage.removeItem('cael_auth_token'); localStorage.removeItem('cael_user'); window.location.reload();" class="help-btn" style="border-color: var(--danger); color: var(--danger); width: 100%;">Log Out</button>
                        </div>
                    `;
                }
                const links = document.querySelector('.auth-links');
                if (links) links.style.display = 'none';
            }
        }

        // Dark mode init
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (prefersDark || localStorage.getItem("cael_theme") === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
        }
        // checkExistingToken() is expected to be in basic.js or defined elsewhere.
        // If it's not, this call will cause an error. Assuming it's in basic.js.
        checkExistingToken();
    </script>
