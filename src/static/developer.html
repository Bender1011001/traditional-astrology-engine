<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Portal | Codex Caelestis</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400&display=swap"
        rel="stylesheet">
    <style>
        .dev-container {
            max-width: 1000px;
            margin: 100px auto;
            padding: 40px;
            background: rgba(10, 10, 15, 0.9);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }

        .key-list {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        .key-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 10px;
            border-radius: 4px;
        }

        .key-meta {
            color: #aaa;
            font-size: 0.9em;
        }

        .usage-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(212, 175, 55, 0.1);
            padding: 20px;
            border: 1px solid var(--accent-gold);
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            color: var(--accent-gold);
            font-family: 'Cinzel', serif;
        }

        .danger-btn {
            background: rgba(200, 50, 50, 0.2);
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
            padding: 5px 10px;
            cursor: pointer;
        }

        .danger-btn:hover {
            background: rgba(200, 50, 50, 0.4);
        }

        .new-key-form {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .copy-btn {
            background: transparent;
            border: none;
            color: var(--accent-gold);
            cursor: pointer;
            margin-left: 10px;
        }
    </style>
</head>

<body>
    <header>
        <div class="header-container">
            <div class="logo">CODEX CAELESTIS <span class="subtitle">API</span></div>
            <nav>
                <a href="index.html" class="nav-link">HOME</a>
                <button onclick="logout()" class="help-btn">LOGOUT</button>
            </nav>
        </div>
    </header>

    <div class="dev-container">
        <h1>Developer Portal</h1>
        <p class="subtitle">Manage your API keys and monitor usage.</p>

        <div class="usage-stats" id="usageStats">
            <div class="stat-card">
                <h3>Plan Tier</h3>
                <div class="stat-value" id="planTier">-</div>
            </div>
            <div class="stat-card">
                <h3>API Calls Used</h3>
                <div class="stat-value" id="callsUsed">0</div>
            </div>
            <div class="stat-card">
                <h3>Changes / Mo</h3>
                <div class="stat-value" id="quotaLimit">0</div>
            </div>
        </div>

        <h2>API Keys</h2>
        <div class="new-key-form">
            <input type="text" id="newKeyName" placeholder="Key Name (e.g. Production)" style="flex:1;">
            <button onclick="createApiKey()" class="help-btn">Generate New Key</button>
        </div>

        <ul id="keyList" class="key-list">
            <!-- Keys injected here -->
        </ul>
    </div>

    <!-- Key Created Modal -->
    <div class="modal-overlay hidden" id="keyModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeKeyModal()">&times;</button>
            <div class="modal-header">
                <h2>KEY GENERATED</h2>
            </div>
            <p>Copy this key now. You won't be able to see it again.</p>
            <div
                style="background: #000; padding: 15px; border: 1px solid var(--accent-gold); word-break: break-all; margin: 20px 0;">
                <code id="newKeyDisplay">sk_live_...</code>
            </div>
            <button class="help-btn" onclick="closeKeyModal()">DONE</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Init on load
        document.addEventListener("DOMContentLoaded", () => {
            loadDeveloperData();
        });
    </script>
</body>

</html>
