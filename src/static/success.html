    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Success | Codex Caelestis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Sora:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .success-container {
            text-align: center;
            padding: 4rem 2rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .success-icon {
            font-size: 4rem;
            color: var(--success);
            margin-bottom: 1.5rem;
        }

        .order-status {
            margin-top: 2rem;
            padding: 1.5rem;
            background: var(--bg-card);
            border: 1px solid var(--gold);
            border-radius: 12px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(192, 122, 43, 0.3);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TJNM5XVD"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div class="background-globes">
        <div class="globe globe-1"></div>
        <div class="globe globe-2"></div>
    </div>

    <main class="success-container">
        <div class="success-icon">✓</div>
        <h1>CHECKOUT COMPLETE</h1>
        <p class="subtitle" style="margin-top: 1rem;">Your subscription is being activated.</p>

        <div id="statusCard" class="order-status">
            <div class="spinner"></div>
            <p><strong>Verified!</strong></p>
            <p>Redirecting you to your dashboard.</p>
            <p style="font-size: 0.9em; color: #888; margin-top: 10px;">Please do not close this tab until redirected.
            </p>
        </div>
    </main>

    <script src="config.js"></script>
    <script>
        const API_BASE = window.CAEL_API_BASE || "";
        function apiUrl(path) { return `${API_BASE}${path}`; }

        async function verifyAndRedirect() {
            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('session_id');
            const statusCard = document.getElementById('statusCard');

            if (!sessionId) {
                statusCard.innerHTML = "<p style='color:var(--danger)'>Error: No session ID found. Please contact support.</p>";
                return;
            }

            try {
                const response = await fetch(apiUrl(`/api/v1/billing/verify-checkout-session?session_id=${sessionId}`));
                if (!response.ok) throw new Error("Verification failed");

                const data = await response.json();

                if (data.access_token) {
                    localStorage.setItem(`cael_token_${data.chart_hash}`, data.access_token);
                    localStorage.setItem("cael_auth_token", data.access_token);
                }

                statusCard.innerHTML = `
                    <p style="color:var(--success); font-weight:600; margin-bottom:1rem;">Verified!</p>
                    <p>Redirecting to your dashboard...</p>
                `;

                setTimeout(() => {
                    window.location.href = `profile.html`;
                }, 2000);

            } catch (err) {
                statusCard.innerHTML = `
                    <p style='color:var(--danger); margin-bottom:1rem;'>Verification failed: ${err.message}</p>
                    <a href="index.html" class="help-btn" style="text-decoration:none; display:inline-block;">Return to Home</a>
                `;
            }
        }

        verifyAndRedirect();
    </script>
</body>

</html>
