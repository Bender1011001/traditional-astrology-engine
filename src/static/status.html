<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>System Status | Codex Caelestis</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .status-container {
            max-width: 600px;
            margin: 4rem auto;
            text-align: center;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--success);
            margin-right: 0.5rem;
        }

        .status-card {
            background: var(--surface);
            border: 1px solid var(--glass-border);
            padding: 2rem;
            border-radius: 12px;
        }

        .component-row {
            display: flex;
            justify-content: space-between;
            padding: 1rem 0;
            border-bottom: 1px solid var(--glass-border);
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="status-container">
            <h1>SYSTEM STATUS</h1>
            <div class="status-card">
                <div class="component-row">
                    <span>Calculation Engine (Hellenistic)</span>
                    <span><span class="status-indicator"></span> OPERATIONAL</span>
                </div>
                <div class="component-row">
                    <span>PDF Generation Service</span>
                    <span><span class="status-indicator"></span> OPERATIONAL</span>
                </div>
                <div class="component-row">
                    <span>Stripe API Connectivity</span>
                    <span><span class="status-indicator"></span> OPERATIONAL</span>
                </div>
                <div class="component-row">
                    <span>API Gateway (B2B)</span>
                    <span><span class="status-indicator"></span> OPERATIONAL</span>
                </div>
            </div>
            <p style="margin-top: 2rem; color: var(--text-muted); font-size: 0.8rem;">Last Check: Feb 6, 2026 20:00 UTC
            </p>
        </div>
    </main>
</body>

</html>
