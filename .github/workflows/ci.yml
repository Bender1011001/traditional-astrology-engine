name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    env:
      STRIPE_SECRET_KEY: unit-stripe-secret
      STRIPE_WEBHOOK_SECRET: unit-webhook-secret
      JWT_SECRET: unit-jwt-secret
      SENDER_EMAIL: tests@example.test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Compile Python
        run: python -m compileall src

      - name: Check static JavaScript
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find src/static -type f -name '*.js' | sort)
          for file in "${files[@]}"; do
            node --check "$file"
          done

      - name: Run tests
        run: python -m pytest src/tests -q --tb=short

  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gcloud-error-to-codex
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gcloud-error-to-codex/package-lock.json

      - run: npm ci
      - run: npm test
