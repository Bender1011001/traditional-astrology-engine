name: Build and Deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACR_NAME: ${{ secrets.REGISTRY_LOGIN_SERVER }}
  APP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }} # Optional: Use secret or hardcode

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Docker image
        run: |
          IMAGE_TAG=$(echo "${{ secrets.REGISTRY_LOGIN_SERVER }}/astrology-engine:latest" | tr '[:upper:]' '[:lower:]')
          docker build . -t $IMAGE_TAG
          docker push $IMAGE_TAG

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }} # e.g., 'astrology-engine'
          images: ${{ secrets.REGISTRY_LOGIN_SERVER }}/astrology-engine:latest
