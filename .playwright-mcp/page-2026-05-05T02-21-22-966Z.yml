      - heading "THE OUTSIDER STRATEGY" [level=2] [ref=e19]
      - generic [ref=e20]:
        - paragraph [ref=e21]: I am not an astrologer. I am a Systems Architect who reverse-engineered their rules.
        - paragraph [ref=e22]: People trust "Outsiders" who audit complex systems more than they trust the insiders. The Astrologer's weakness is that they are "too close" to the material. They "feel" the chart.
        - paragraph [ref=e23]:
          - text: My strength is that I don't care about the feelings. I care about the
          - strong [ref=e24]: Rule Validity
          - text: .
        - paragraph [ref=e25]: I approached this as a data ingestion problem. I analyzed 2,000 years of texts (Valens, Lilly, Bonatti) that most ignore, and I built this engine to enforce those rules strictly.
        - paragraph [ref=e26]: The result is this engine. It performs the rigorous "Forensic Audit" calculations—Sect, Almuten, Mutual Receptions—without bias.
        - paragraph [ref=e27]: I didn't write the astrology; I compiled it.
      - paragraph [ref=e29]: "\"I used to be a hard materialist. I believed you couldn't predict a damn thing based on a birth chart. Then I ran my own data through this engine. It identified me as a 'Forensic Auditor'—a systems architect building complex logic in the dark. It described my life better than I could. I don't ask you to believe in astrology. I ask you to trust the audit.\""
    - generic [ref=e32]:
      - generic [ref=e33]:
        - heading "MISSION" [level=2] [ref=e34]
        - paragraph [ref=e35]: Traditional Astrology exists to restore technical, auditable astrology. Every delineation is grounded in a classical source, calculated through transparent rules, and delivered with explicit limitations. The goal is not to inspire or console, but to judge natal promise with disciplined technique.
      - generic [ref=e36]:
        - strong [ref=e37]: "Core commitments:"
        - text: classical sources, reproducible rules, and zero modern psychological overlay.
    - generic [ref=e38]:
      - heading "LINEAGE & AUTHORITY" [level=2] [ref=e39]
      - paragraph [ref=e40]: We follow the transmission of traditional astrology from the Hellenistic era, through Arabic synthesis, to Renaissance practice. This lineage defines the interpretive rules used in every report.
      - generic [ref=e41]:
        - generic [ref=e42]:
          - heading "Classical Canon" [level=4] [ref=e43]
          - paragraph [ref=e44]: "Ptolemy, Dorotheus, Valens, and Firmicus supply foundational doctrine: sect, essential dignity, and topic delineation."
        - generic [ref=e45]:
          - heading "Medieval Transmission" [level=4] [ref=e46]
          - paragraph [ref=e47]: Abu Ma'shar, Al-Biruni, and Bonatti preserve and refine technique, especially in judgment and timing.
        - generic [ref=e48]:
          - heading "Renaissance Discipline" [level=4] [ref=e49]
          - paragraph [ref=e50]: Lilly and his contemporaries formalize rules for planetary strength, practical judgment, and predictive rigor.
