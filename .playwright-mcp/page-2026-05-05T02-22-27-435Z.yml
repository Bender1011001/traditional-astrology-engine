      - heading "What Is Horary Astrology?" [level=2] [ref=e48]
      - paragraph [ref=e49]: The oldest question-answering technique in Western astrology.
      - generic [ref=e51]:
        - paragraph [ref=e52]:
          - text: Horary astrology is a branch of traditional astrology that answers a specific question by erecting a chart for the exact moment the question is sincerely asked. Unlike natal astrology — which maps your entire life from birth — horary focuses on
          - strong [ref=e53]: one question, one moment, one answer
          - text: .
        - paragraph [ref=e54]:
          - text: The method was perfected by William Lilly in his 1647 masterwork
          - emphasis [ref=e55]: Christian Astrology
          - text: ", though its roots trace back to the Arabic astrologers of the 8th–10th centuries (Masha'allah, Sahl ibn Bishr) and ultimately to the Hellenistic tradition. It remains the most empirically testable branch of astrology — you ask, the chart answers, and life confirms or denies."
    - generic [ref=e56]:
      - heading "How the Oracle Works" [level=2] [ref=e57]
      - paragraph [ref=e58]: Three mathematical steps. No guessing.
      - generic [ref=e59]:
        - generic [ref=e60]:
          - generic [ref=e61]: "1"
          - heading "Erect the Chart" [level=3] [ref=e62]
          - paragraph [ref=e63]: A Regiomontanus chart is cast for the exact moment you submit your question and your current geographic coordinates. Real ephemeris data — the same Swiss Ephemeris used by professional astrologers.
        - generic [ref=e64]:
          - generic [ref=e65]: "2"
          - heading "Identify Significators" [level=3] [ref=e66]
          - paragraph [ref=e67]: The Querent (you) is represented by the 1st house ruler. The Quesited (what you're asking about) is assigned to its natural house — 7th for relationships, 10th for career, 2nd for money, and so on. The Moon always co-signifies the Querent.
        - generic [ref=e68]:
          - generic [ref=e69]: "3"
          - heading "Judge Perfection" [level=3] [ref=e70]
          - paragraph [ref=e71]: "The engine checks whether the significators are applying to aspect, translating light, collecting light, or being prohibited. It scores each condition mathematically and delivers a weighted verdict: Yes, No, or Uncertain."
    - generic [ref=e72]:
      - heading "Key Horary Principles" [level=2] [ref=e73]
      - paragraph [ref=e74]: The classical rules that govern every judgment.
      - generic [ref=e75]:
        - generic [ref=e76]:
          - heading "✦ Significators" [level=4] [ref=e77]
          - paragraph [ref=e78]: The Lord of the Ascendant represents you. The Lord of the relevant house represents what you're asking about. Aspects between them — or not — determine the outcome.
        - generic [ref=e79]:
          - heading "✦ Perfection" [level=4] [ref=e80]
          - paragraph [ref=e81]: If the significators are applying to a major aspect (conjunction, sextile, trine, square, opposition), the matter "perfects" — meaning the answer tends toward Yes. No applying aspect means No.
        - generic [ref=e82]:
          - heading "✦ Translation of Light" [level=4] [ref=e83]
          - paragraph [ref=e84]: A faster planet can carry the light from one significator to the other, acting as a go-between or intermediary. This is a classical mechanism for things coming together through a third party.
        - generic [ref=e85]:
          - heading "✦ Prohibition" [level=4] [ref=e86]
          - paragraph [ref=e87]: When a third planet aspects one of the significators before they can perfect, it "prohibits" — blocks — the outcome. Something or someone interferes.
        - generic [ref=e88]:
          - heading "✦ Strictures Against Judgment" [level=4] [ref=e89]
          - paragraph [ref=e90]: Certain chart conditions — early Ascendant, late Ascendant, Saturn in the 7th, void-of-course Moon — indicate the chart may not be fit for judgment. The engine checks and reports these transparently.
        - generic [ref=e91]:
          - heading "✦ Regiomontanus Houses" [level=4] [ref=e92]
          - paragraph [ref=e93]: Classical horary uses Regiomontanus house division, not whole sign. This was the standard for Lilly and the Renaissance horary tradition. House cusps are calculated from real astronomical data.
